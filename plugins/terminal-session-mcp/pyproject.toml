[project]
name = "terminal-session-mcp"
version = "0.1.0"
description = "PTY terminal session recorder MCP server for Claude Code"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "pexpect>=4.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
